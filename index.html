<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Eşşek</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #151114;
    color: #fff1f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x: hidden;
}

/* =====================================================
   HAREKETLİ YILDIZLAR
===================================================== */

.stars {
    position: fixed;
    inset: 0;
    z-index: 0;

    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    left: -30px;

    display: block;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #f3aec2;

    box-shadow:
        0 0 5px #f3aec2,
        0 0 10px rgba(243,174,194,.5);

    opacity: .75;

    animation-name: moveStar;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

/* Her yıldız farklı yükseklik / hız / boyut */

.star:nth-child(1) {
    top: 8%;
    width: 3px;
    height: 3px;
    animation-duration: 12s;
    animation-delay: -8s;
}

.star:nth-child(2) {
    top: 17%;
    width: 2px;
    height: 2px;
    animation-duration: 18s;
    animation-delay: -4s;
}

.star:nth-child(3) {
    top: 26%;
    width: 4px;
    height: 4px;
    animation-duration: 15s;
    animation-delay: -12s;
}

.star:nth-child(4) {
    top: 34%;
    width: 2px;
    height: 2px;
    animation-duration: 21s;
    animation-delay: -17s;
}

.star:nth-child(5) {
    top: 43%;
    width: 3px;
    height: 3px;
    animation-duration: 14s;
    animation-delay: -5s;
}

.star:nth-child(6) {
    top: 51%;
    width: 2px;
    height: 2px;
    animation-duration: 19s;
    animation-delay: -13s;
}

.star:nth-child(7) {
    top: 59%;
    width: 4px;
    height: 4px;
    animation-duration: 17s;
    animation-delay: -2s;
}

.star:nth-child(8) {
    top: 67%;
    width: 2px;
    height: 2px;
    animation-duration: 13s;
    animation-delay: -10s;
}

.star:nth-child(9) {
    top: 74%;
    width: 3px;
    height: 3px;
    animation-duration: 20s;
    animation-delay: -15s;
}

.star:nth-child(10) {
    top: 82%;
    width: 2px;
    height: 2px;
    animation-duration: 16s;
    animation-delay: -7s;
}

.star:nth-child(11) {
    top: 91%;
    width: 3px;
    height: 3px;
    animation-duration: 22s;
    animation-delay: -18s;
}

.star:nth-child(12) {
    top: 13%;
    width: 2px;
    height: 2px;
    animation-duration: 24s;
    animation-delay: -20s;
}

.star:nth-child(13) {
    top: 31%;
    width: 3px;
    height: 3px;
    animation-duration: 18s;
    animation-delay: -9s;
}

.star:nth-child(14) {
    top: 47%;
    width: 2px;
    height: 2px;
    animation-duration: 12s;
    animation-delay: -6s;
}

.star:nth-child(15) {
    top: 63%;
    width: 3px;
    height: 3px;
    animation-duration: 23s;
    animation-delay: -19s;
}

.star:nth-child(16) {
    top: 87%;
    width: 2px;
    height: 2px;
    animation-duration: 15s;
    animation-delay: -11s;
}

@keyframes moveStar {
    0% {
        transform: translate3d(-40px, 0, 0);
        opacity: 0;
    }

    8% {
        opacity: .7;
    }

    50% {
        opacity: .85;
    }

    92% {
        opacity: .7;
    }

    100% {
        transform: translate3d(calc(100vw + 80px), -35px, 0);
        opacity: 0;
    }
}

/* =====================================================
   ANA ALAN
===================================================== */

.app {
    position: relative;
    z-index: 2;

    width: min(100% - 24px, 575px);

    margin: 0 auto;

    padding:
        max(12px, env(safe-area-inset-top))
        0
        max(24px, env(safe-area-inset-bottom));
}

/* =====================================================
   BAŞLIK
===================================================== */

.header {
    padding: 3px 2px 16px;
}

.header h1 {
    margin: 0;

    font-size: 24px;
    line-height: 1;

    font-weight: 900;

    letter-spacing: -.8px;
}

/* =====================================================
   SAAT
===================================================== */

.clock-card {
    width: 100%;

    padding: 24px 12px 19px;

    text-align: center;

    background: #211a1e;

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 22px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.22);
}

.clock {
    font-size: clamp(43px, 12vw, 62px);

    line-height: 1;

    font-weight: 900;

    letter-spacing: -2px;

    color: #e9a3b9;

    font-variant-numeric: tabular-nums;
}

.date {
    margin-top: 10px;

    font-size: 12px;
    font-weight: 800;
}

.timezone {
    margin-top: 4px;

    color: #9d8b92;

    font-size: 8px;
}

/* =====================================================
   NASILSIN
===================================================== */

.health-card {
    margin-top: 13px;

    padding: 16px;

    background: #211a1e;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 20px;
}

.health-title {
    margin-bottom: 9px;

    font-size: 12px;
    font-weight: 900;
}

.health-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

.health-btn {
    min-height: 51px;

    border: 1px solid transparent;

    border-radius: 13px;

    background: #281f24;

    color: #fff1f5;

    cursor: pointer;
}

.health-btn.active {
    background: #392a31;

    border-color: #805363;

    color: #eca9bd;
}

.health-label {
    display: block;

    font-size: 10px;
    font-weight: 900;
}

.health-sub {
    display: block;

    margin-top: 3px;

    color: #9e8b92;

    font-size: 7px;
}

/* =====================================================
   İLAÇ BAŞLIĞI
===================================================== */

.section-head {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin:
        17px 3px 9px;
}

.section-title {
    font-size: 14px;
    font-weight: 900;
}

.section-date {
    color: #918087;

    font-size: 8px;
}

/* =====================================================
   İLAÇLAR
===================================================== */

.medicines {
    display: flex;
    flex-direction: column;

    gap: 9px;
}

.medicine {
    display: grid;

    /*
       TAM HİZALAMA BURADA:

       ikon | içerik | 90px sabit buton kolonu

       Her ilaç aynı 90px kolonu kullanıyor.
    */
    grid-template-columns:
        43px
        minmax(0, 1fr)
        90px;

    align-items: center;

    column-gap: 10px;

    width: 100%;

    padding: 12px;

    background: #211a1e;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 18px;
}

/* =====================================================
   İKON
===================================================== */

.med-icon {
    width: 43px;
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    font-size: 18px;
}

.bet-icon {
    background: rgba(216,137,161,.13);
}

.cit-icon {
    background: rgba(111,178,143,.12);
}

.b12-icon {
    background: rgba(235,165,101,.12);
}

/* =====================================================
   İÇERİK
===================================================== */

.med-content {
    min-width: 0;
}

.med-name {
    margin-bottom: 4px;

    font-size: 12px;
    font-weight: 900;
}

.med-desc {
    color: #a39299;

    font-size: 8px;

    line-height: 1.4;
}

/* =====================================================
   BETASERC DOZLARI
===================================================== */

.dose-list {
    display: flex;
    flex-direction: column;

    gap: 6px;

    margin-top: 8px;
}

.dose-row {
    min-height: 31px;

    display: flex;

    align-items: center;

    padding-left: 8px;

    border-radius: 9px;

    background: rgba(216,137,161,.07);

    color: #a9979e;

    font-size: 8px;
    font-weight: 800;
}

/* =====================================================
   BUTON KOLONU

   Betaserc'te iki buton burada.
   Citoles/B12'de tek buton burada.

   Böylece SAĞ KENARLAR %100 AYNI.
===================================================== */

.action-column {
    width: 90px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: stretch;

    gap: 6px;
}

.take {
    width: 90px;
    min-width: 90px;

    height: 37px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    border: 0;

    border-radius: 10px;

    background: #d5849d;

    color: white;

    font-size: 9px;
    font-weight: 900;

    white-space: nowrap;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .18s ease;
}

.take:active {
    transform: scale(.95);
}

.take.done {
    background: #6fae8c;
}

/* =====================================================
   BUGÜNKÜ DURUM
===================================================== */

.progress-card {
    margin-top: 12px;

    padding: 13px 15px;

    background: #211a1e;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 17px;
}

.progress-head {
    display: flex;

    align-items: center;
    justify-content: space-between;
}

.progress-title {
    font-size: 10px;
    font-weight: 900;
}

.progress-count {
    color: #e7a2b8;

    font-size: 9px;
    font-weight: 900;
}

.hearts {
    display: flex;

    gap: 4px;

    margin-top: 7px;
}

.progress-heart {
    color: #5f4b53;

    font-size: 15px;
}

.progress-heart.active {
    color: #e7a2b8;
}

.complete {
    display: none;

    margin-top: 8px;

    padding: 8px;

    border-radius: 9px;

    background: rgba(111,174,140,.1);

    color: #91c8a8;

    text-align: center;

    font-size: 8px;
    font-weight: 800;
}

.complete.show {
    display: block;
}

/* =====================================================
   SIFIRLA
===================================================== */

.reset-area {
    text-align: center;

    margin-top: 11px;
}

.reset-btn {
    padding: 5px 8px;

    border: 0;

    background: transparent;

    color: #76666c;

    font-size: 7px;

    text-decoration: underline;

    cursor: pointer;
}

/* =====================================================
   KALPLER
===================================================== */

.floating-heart {
    position: fixed;

    z-index: 100;

    pointer-events: none;

    color: #ec9fb7;

    font-size: 17px;

    animation:
        heartFloat 1.1s ease-out forwards;
}

@keyframes heartFloat {
    0% {
        opacity: 0;
        transform: translate(0,0) scale(.5);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(var(--moveX), -90px)
            rotate(var(--rotate))
            scale(1);
    }
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;

    left: 50%;
    bottom: 18px;

    z-index: 200;

    padding: 9px 13px;

    border-radius: 12px;

    background: #fff0f4;

    color: #49343b;

    font-size: 9px;
    font-weight: 900;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, 20px);

    transition: .2s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =====================================================
   KÜÇÜK IPHONE
===================================================== */

@media (max-width: 390px) {

    .app {
        width: calc(100% - 18px);
    }

    .medicine {
        grid-template-columns:
            39px
            minmax(0, 1fr)
            78px;

        column-gap: 8px;

        padding: 11px;
    }

    .med-icon {
        width: 39px;
        height: 39px;
    }

    .action-column {
        width: 78px;
    }

    .take {
        width: 78px;
        min-width: 78px;
    }

    .clock {
        font-size: 42px;
    }
}

@media (max-width: 350px) {

    .medicine {
        grid-template-columns:
            36px
            minmax(0, 1fr)
            72px;
    }

    .med-icon {
        width: 36px;
        height: 36px;
    }

    .action-column {
        width: 72px;
    }

    .take {
        width: 72px;
        min-width: 72px;

        font-size: 8px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     YILDIZLAR
===================================================== -->

<div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
</div>

<main class="app">

    <header class="header">
        <h1>Eşşek</h1>
    </header>

    <!-- SAAT -->

    <section class="clock-card">

        <div id="clock" class="clock">
            00:00:00
        </div>

        <div id="date" class="date">
            Tarih
        </div>

        <div class="timezone">
            Türkiye saati
        </div>

    </section>

    <!-- NASILSIN -->

    <section class="health-card">

        <div class="health-title">
            Bugün nasılsın?
        </div>

        <div class="health-buttons">

            <button
                id="goodBtn"
                class="health-btn"
                onclick="setHealth('good')"
            >
                <span class="health-label">
                    İyiyim
                </span>

                <span class="health-sub">
                    keyfim yerinde
                </span>
            </button>

            <button
                id="badBtn"
                class="health-btn"
                onclick="setHealth('bad')"
            >
                <span class="health-label">
                    İyi değilim
                </span>

                <span class="health-sub">
                    biraz kötüyüm
                </span>
            </button>

        </div>

    </section>

    <!-- İLAÇ BAŞLIĞI -->

    <div class="section-head">

        <div class="section-title">
            İlaçlar
        </div>

        <div
            id="sectionDate"
            class="section-date"
        ></div>

    </div>

    <section class="medicines">

        <!-- =================================================
             BETASERC

             BUTONLAR SAĞDAKİ SABİT 90px KOLONDA.
        ================================================== -->

        <article class="medicine">

            <div class="med-icon bet-icon">
                💗
            </div>

            <div class="med-content">

                <div class="med-name">
                    Betaserc
                </div>

                <div
                    id="betasercDesc"
                    class="med-desc"
                >
                    İyiyken sabah kullan.
                </div>

                <div class="dose-list">

                    <div class="dose-row">
                        Sabah
                    </div>

                    <div
                        id="eveningRow"
                        class="dose-row"
                        style="display:none"
                    >
                        Akşam
                    </div>

                </div>

            </div>

            <!-- SABİT BUTON KOLONU -->

            <div class="action-column">

                <button
                    id="betasercMorning"
                    class="take"
                    onclick="toggleDose('betasercMorning', this)"
                >
                    Aldım
                </button>

                <button
                    id="betasercEvening"
                    class="take"
                    style="display:none"
                    onclick="toggleDose('betasercEvening', this)"
                >
                    Aldım
                </button>

            </div>

        </article>

        <!-- =================================================
             CITOLES
        ================================================== -->

        <article class="medicine">

            <div class="med-icon cit-icon">
                🌿
            </div>

            <div class="med-content">

                <div class="med-name">
                    Citoles
                </div>

                <div class="med-desc">
                    Sabah içmeyi unutma.
                </div>

            </div>

            <div class="action-column">

                <button
                    id="citoles"
                    class="take"
                    onclick="toggleDose('citoles', this)"
                >
                    Aldım
                </button>

            </div>

        </article>

        <!-- =================================================
             B12
        ================================================== -->

        <article class="medicine">

            <div class="med-icon b12-icon">
                🧡
            </div>

            <div class="med-content">

                <div class="med-name">
                    B12
                </div>

                <div class="med-desc">
                    Tok karnına, günde 1 defa.
                </div>

            </div>

            <div class="action-column">

                <button
                    id="b12"
                    class="take"
                    onclick="toggleDose('b12', this)"
                >
                    Aldım
                </button>

            </div>

        </article>

    </section>

    <!-- DURUM -->

    <section class="progress-card">

        <div class="progress-head">

            <div class="progress-title">
                Bugünkü durum
            </div>

            <div
                id="progressCount"
                class="progress-count"
            >
                0 / 3
            </div>

        </div>

        <div
            id="hearts"
            class="hearts"
        ></div>

        <div
            id="complete"
            class="complete"
        >
            Bugünlük tamamdır.
        </div>

    </section>

    <div class="reset-area">

        <button
            class="reset-btn"
            onclick="resetToday()"
        >
            Bugünü sıfırla
        </button>

    </div>

</main>

<div id="toast" class="toast"></div>

<script>

/* =====================================================
   TÜRKİYE TARİHİ
===================================================== */

function turkeyDate() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Europe/Istanbul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date());

}


/* =====================================================
   VERİ
===================================================== */

function storageKey() {

    return "esek_" + turkeyDate();

}


function defaultData() {

    return {

        health: "good",

        doses: {

            betasercMorning: false,
            betasercEvening: false,
            citoles: false,
            b12: false

        }

    };

}


function loadData() {

    const saved =
        localStorage.getItem(
            storageKey()
        );

    if (!saved) {
        return defaultData();
    }

    try {

        return JSON.parse(saved);

    } catch {

        return defaultData();

    }

}


let data = loadData();


function saveData() {

    localStorage.setItem(
        storageKey(),
        JSON.stringify(data)
    );

}


/* =====================================================
   SAAT
===================================================== */

function updateClock() {

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            "tr-TR",
            {
                timeZone: "Europe/Istanbul",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );

    const date =
        now.toLocaleDateString(
            "tr-TR",
            {
                timeZone: "Europe/Istanbul",
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    document.getElementById(
        "clock"
    ).textContent = time;

    document.getElementById(
        "date"
    ).textContent = date;

    document.getElementById(
        "sectionDate"
    ).textContent = date;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   SAĞLIK DURUMU
===================================================== */

function setHealth(status) {

    data.health = status;

    saveData();

    render();

}


/* =====================================================
   BETASERC
===================================================== */

function updateBetaserc() {

    const eveningRow =
        document.getElementById(
            "eveningRow"
        );

    const eveningButton =
        document.getElementById(
            "betasercEvening"
        );

    const description =
        document.getElementById(
            "betasercDesc"
        );

    if (data.health === "bad") {

        eveningRow.style.display =
            "flex";

        eveningButton.style.display =
            "flex";

        description.textContent =
            "İyi değilsen sabah ve akşam kullan.";

    } else {

        eveningRow.style.display =
            "none";

        eveningButton.style.display =
            "none";

        description.textContent =
            "İyiyken sabah kullan.";

    }

    setButton(
        "betasercMorning",
        data.doses.betasercMorning
    );

    setButton(
        "betasercEvening",
        data.doses.betasercEvening
    );

}


/* =====================================================
   BUTON DURUMU
===================================================== */

function setButton(id, done) {

    const button =
        document.getElementById(id);

    if (!button) return;

    button.classList.toggle(
        "done",
        done
    );

    button.textContent =
        done
            ? "✓ Alındı"
            : "Aldım";

}


/* =====================================================
   İLAÇ AL
===================================================== */

function toggleDose(
    medicine,
    button
) {

    const wasDone =
        data.doses[medicine];

    data.doses[medicine] =
        !wasDone;

    saveData();

    render();

    if (!wasDone) {
        createHearts(button);
    }

}


/* =====================================================
   İLERLEME
===================================================== */

function updateProgress() {

    let total = 3;

    let done = 0;

    if (
        data.doses.betasercMorning
    ) {
        done++;
    }

    if (
        data.doses.citoles
    ) {
        done++;
    }

    if (
        data.doses.b12
    ) {
        done++;
    }

    if (
        data.health === "bad"
    ) {

        total = 4;

        if (
            data.doses.betasercEvening
        ) {
            done++;
        }

    }

    document.getElementById(
        "progressCount"
    ).textContent =
        done + " / " + total;

    const hearts =
        document.getElementById(
            "hearts"
        );

    hearts.innerHTML = "";

    for (
        let i = 0;
        i < total;
        i++
    ) {

        const heart =
            document.createElement(
                "span"
            );

        heart.className =
            "progress-heart";

        heart.textContent =
            i < done
                ? "♥"
                : "♡";

        if (i < done) {
            heart.classList.add(
                "active"
            );
        }

        hearts.appendChild(
            heart
        );

    }

    document.getElementById(
        "complete"
    ).classList.toggle(
        "show",
        done === total
    );

}


/* =====================================================
   SAĞLIK BUTONLARI
===================================================== */

function updateHealth() {

    document.getElementById(
        "goodBtn"
    ).classList.toggle(
        "active",
        data.health === "good"
    );

    document.getElementById(
        "badBtn"
    ).classList.toggle(
        "active",
        data.health === "bad"
    );

}


/* =====================================================
   KALPLER
===================================================== */

function createHearts(button) {

    const rect =
        button.getBoundingClientRect();

    const symbols = [
        "♥",
        "♥",
        "✦",
        "♥",
        "✦"
    ];

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const heart =
            document.createElement(
                "span"
            );

        heart.className =
            "floating-heart";

        heart.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        heart.style.left =
            (
                rect.left +
                rect.width / 2
            ) + "px";

        heart.style.top =
            (
                rect.top +
                rect.height / 2
            ) + "px";

        heart.style.setProperty(
            "--moveX",
            (
                Math.random() * 80 - 40
            ) + "px"
        );

        heart.style.setProperty(
            "--rotate",
            (
                Math.random() * 50 - 25
            ) + "deg"
        );

        heart.style.animationDelay =
            (
                Math.random() * .12
            ) + "s";

        document.body.appendChild(
            heart
        );

        setTimeout(
            () => heart.remove(),
            1300
        );

    }

}


/* =====================================================
   SIFIRLA
===================================================== */

function resetToday() {

    const answer =
        confirm(
            "Bugünün kayıtları sıfırlansın mı?"
        );

    if (!answer) return;

    localStorage.removeItem(
        storageKey()
    );

    data =
        defaultData();

    render();

}


/* =====================================================
   YENİ GÜN KONTROLÜ
===================================================== */

let currentDay =
    turkeyDate();

setInterval(
    () => {

        const today =
            turkeyDate();

        if (
            today !== currentDay
        ) {

            currentDay =
                today;

            data =
                loadData();

            render();

        }

    },
    1000
);


/* =====================================================
   RENDER
===================================================== */

function render() {

    updateHealth();

    updateBetaserc();

    setButton(
        "citoles",
        data.doses.citoles
    );

    setButton(
        "b12",
        data.doses.b12
    );

    updateProgress();

}

render();

</script>
