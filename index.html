<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7b7c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>Esila bacım içindir</title>

  <style>
    :root {
      --bg: #fff9fb;
      --card: rgba(255,255,255,.95);
      --text: #49333b;
      --muted: #997983;

      --pink: #e7a0b1;
      --pink-dark: #d9859b;
      --pink-light: #fde9ee;

      --green: #72b995;
      --green-light: #e6f5ed;

      --border: rgba(200,120,145,.13);
      --shadow: 0 8px 25px rgba(180,100,125,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(247,183,199,.22),
          transparent 35%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }

    .app {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 650px;

      margin: 0 auto;

      padding:
        max(13px, env(safe-area-inset-top))
        15px
        max(28px, env(safe-area-inset-bottom));
    }

    /* YILDIZLAR */

    .stars {
      position: fixed;
      inset: 0;

      z-index: 0;

      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #efb5c4;

      opacity: .45;

      box-shadow:
        0 0 7px rgba(239,181,196,.55);

      animation:
        starFloat linear infinite,
        starTwinkle ease-in-out infinite;
    }

    .star:nth-child(1) {
      left: 8%;
      top: 16%;
      animation-duration: 13s,2.5s;
      animation-delay: -3s,-.5s;
    }

    .star:nth-child(2) {
      left: 22%;
      top: 48%;
      width: 3px;
      height: 3px;
      animation-duration: 16s,3s;
      animation-delay: -8s,-1s;
    }

    .star:nth-child(3) {
      left: 37%;
      top: 9%;
      width: 5px;
      height: 5px;
      animation-duration: 18s,2.8s;
      animation-delay: -4s,-.7s;
    }

    .star:nth-child(4) {
      left: 51%;
      top: 67%;
      width: 3px;
      height: 3px;
      animation-duration: 14s,3.4s;
      animation-delay: -10s,-1.5s;
    }

    .star:nth-child(5) {
      left: 68%;
      top: 28%;
      width: 4px;
      height: 4px;
      animation-duration: 17s,2.7s;
      animation-delay: -5s,-.3s;
    }

    .star:nth-child(6) {
      left: 82%;
      top: 58%;
      width: 3px;
      height: 3px;
      animation-duration: 15s,3.2s;
      animation-delay: -7s,-1.2s;
    }

    .star:nth-child(7) {
      left: 92%;
      top: 15%;
      width: 5px;
      height: 5px;
      animation-duration: 19s,2.9s;
      animation-delay: -11s,-.9s;
    }

    .star:nth-child(8) {
      left: 13%;
      top: 82%;
      width: 3px;
      height: 3px;
      animation-duration: 12s,3.6s;
      animation-delay: -6s,-2s;
    }

    .star:nth-child(9) {
      left: 45%;
      top: 88%;
      width: 4px;
      height: 4px;
      animation-duration: 20s,2.6s;
      animation-delay: -14s,-.2s;
    }

    .star:nth-child(10) {
      left: 76%;
      top: 84%;
      width: 3px;
      height: 3px;
      animation-duration: 14s,3.1s;
      animation-delay: -9s,-1.1s;
    }

    .star:nth-child(11) {
      left: 58%;
      top: 42%;
      width: 3px;
      height: 3px;
      animation-duration: 18s,2.4s;
      animation-delay: -13s,-.8s;
    }

    .star:nth-child(12) {
      left: 29%;
      top: 73%;
      width: 4px;
      height: 4px;
      animation-duration: 16s,3.5s;
      animation-delay: -2s,-1.7s;
    }

    @keyframes starFloat {
      0% {
        transform: translate3d(-10px,15px,0);
      }

      50% {
        transform: translate3d(15px,-20px,0);
      }

      100% {
        transform: translate3d(-10px,15px,0);
      }
    }

    @keyframes starTwinkle {
      0%,100% {
        opacity: .2;
        transform: scale(.75);
      }

      50% {
        opacity: .7;
        transform: scale(1.15);
      }
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 7px 2px 16px;
    }

    .hello-small {
      color: var(--muted);

      font-size: 11px;
      font-weight: 650;

      margin-bottom: 3px;
    }

    .hello-title {
      margin: 0;

      font-size: 23px;
      line-height: 1.15;

      font-weight: 850;
      letter-spacing: -.4px;
    }

    .theme-btn {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: var(--card);
      color: var(--text);

      box-shadow: var(--shadow);

      cursor: pointer;
    }

    /* SAAT */

    .clock-card {
      text-align: center;

      padding: 19px 14px;
      margin-bottom: 14px;

      border: 1px solid var(--border);
      border-radius: 23px;

      background: var(--card);
      box-shadow: var(--shadow);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .clock {
      font-size: clamp(40px,13vw,61px);
      line-height: 1;

      font-weight: 850;
      letter-spacing: .5px;

      color: var(--pink-dark);

      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 8px;

      font-size: 13px;
      font-weight: 750;
    }

    .timezone {
      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 600;
    }

    /* NASILSIN */

    .health-card {
      padding: 17px;
      margin-bottom: 17px;

      border: 1px solid var(--border);
      border-radius: 23px;

      background: var(--card);
      box-shadow: var(--shadow);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .health-title {
      margin-bottom: 10px;

      font-size: 14px;
      font-weight: 800;
    }

    .health-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .health-btn {
      min-height: 52px;

      border: 1px solid transparent;
      border-radius: 14px;

      background: #fff4f7;
      color: var(--text);

      cursor: pointer;

      transition:
        transform .15s ease,
        background .2s ease;
    }

    .health-btn:active {
      transform: scale(.97);
    }

    .health-label {
      font-size: 12px;
      font-weight: 800;
    }

    .health-sub {
      display: block;

      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 600;
    }

    .health-btn.active {
      background: var(--pink-light);

      border-color:
        rgba(220,135,157,.25);

      color: var(--pink-dark);
    }

    /* BAŞLIK */

    .section-head {
      display: flex;

      justify-content: space-between;
      align-items: end;

      margin: 0 3px 10px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 850;
    }

    .section-date {
      color: var(--muted);

      font-size: 9px;
      font-weight: 650;

      text-align: right;
    }

    /* İLAÇLAR */

    .medicines {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .medicine {
      display: grid;

      grid-template-columns:
        44px
        minmax(0,1fr)
        78px;

      align-items: center;

      gap: 11px;

      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 19px;

      background: var(--card);
      box-shadow: var(--shadow);

      min-width: 0;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .medicine.done-card {
      border-color:
        rgba(114,185,149,.28);
    }

    .med-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      font-size: 19px;
    }

    .betaserc-icon {
      background: var(--pink-light);
    }

    .citoles-icon {
      background: #e9f6ef;
    }

    .b12-icon {
      background: #fff0df;
    }

    .med-content {
      min-width: 0;
    }

    .med-name {
      margin-bottom: 4px;

      font-size: 14px;
      font-weight: 850;
    }

    .med-desc {
      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;

      font-weight: 550;
    }

    /* DOZLAR */

    .dose-list {
      display: flex;
      flex-direction: column;

      gap: 6px;

      margin-top: 9px;
    }

    .dose {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        78px;

      align-items: center;

      gap: 8px;

      padding: 7px;

      border-radius: 10px;

      background: var(--pink-light);
    }

    .dose-info {
      min-width: 0;

      color: var(--muted);

      font-size: 9px;
      font-weight: 750;
    }

    /* BUTONLAR */

    .take {
      width: 78px;
      min-width: 78px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;

      border: 0;
      border-radius: 10px;

      background: var(--pink);
      color: white;

      font-size: 9.5px;
      font-weight: 850;

      white-space: nowrap;

      cursor: pointer;

      transition:
        transform .15s ease,
        background .2s ease;
    }

    .take:active {
      transform: scale(.94);
    }

    .take.done {
      background: var(--green);
    }

    .single-take {
      justify-self: end;
      align-self: center;
    }

    /* İLERLEME */

    .progress-card {
      margin-top: 13px;

      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 19px;

      background: var(--card);
      box-shadow: var(--shadow);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .progress-head {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    .progress-title {
      font-size: 12px;
      font-weight: 800;
    }

    .progress-count {
      color: var(--pink-dark);

      font-size: 11px;
      font-weight: 850;
    }

    .hearts-progress {
      display: flex;
      gap: 4px;
    }

    .progress-heart {
      color: #e9b4c1;
      font-size: 19px;
    }

    .progress-heart.active {
      color: var(--pink-dark);
    }

    .complete {
      display: none;

      margin-top: 10px;
      padding: 10px;

      border-radius: 12px;

      text-align: center;

      color: #4d9a76;
      background: var(--green-light);

      font-size: 11px;
      font-weight: 800;
    }

    .complete.show {
      display: block;
    }

    /* SIFIRLA */

    .reset-area {
      text-align: center;
      margin-top: 17px;
    }

    .reset-btn {
      border: 0;

      padding: 6px 10px;

      background: transparent;
      color: #b38d97;

      font-size: 9px;
      font-weight: 650;

      text-decoration: underline;
      text-underline-offset: 3px;

      cursor: pointer;

      opacity: .75;
    }

    .reset-btn:active {
      opacity: 1;
    }

    /* KALP */

    .floating-heart {
      position: fixed;

      z-index: 9999;

      pointer-events: none;

      font-size: 18px;

      animation:
        floatHeart 1.1s ease-out forwards;
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;

        transform:
          translateY(8px)
          scale(.55);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translate(
            var(--x),
            -90px
          )
          scale(1.05)
          rotate(var(--r));
      }
    }

    /* TOAST */

    .toast {
      position: fixed;

      z-index: 10000;

      left: 50%;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom)
        );

      transform:
        translate(-50%,20px);

      width: max-content;

      max-width:
        calc(100vw - 30px);

      padding: 10px 14px;

      border-radius: 14px;

      background:
        rgba(70,43,53,.94);

      color: white;

      text-align: center;

      font-size: 11px;
      font-weight: 750;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0);
    }

    /* DARK MODE */

    body.dark {
      --bg: #1e181b;
      --card: #2b2227;

      --text: #fff0f4;
      --muted: #bea7af;

      --pink: #dc92a7;
      --pink-dark: #d9879d;

      --pink-light:
        rgba(220,146,167,.14);

      --border:
        rgba(255,255,255,.06);

      background: #1e181b;
    }

    body.dark .health-btn {
      background: #34272d;
      color: var(--text);
    }

    body.dark .health-btn.active {
      background: var(--pink-light);
      color: #f2afc0;
    }

    /* KÜÇÜK EKRAN */

    @media (max-width:380px) {
      .app {
        padding-left: 11px;
        padding-right: 11px;
      }

      .medicine {
        grid-template-columns:
          41px
          minmax(0,1fr)
          74px;

        gap: 8px;
        padding: 11px;
      }

      .med-icon {
        width: 41px;
        height: 41px;
        font-size: 17px;
      }

      .med-name {
        font-size: 13px;
      }

      .med-desc {
        font-size: 9.5px;
      }

      .dose {
        grid-template-columns:
          minmax(0,1fr)
          74px;
      }

      .take {
        width: 74px;
        min-width: 74px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .star,
      .floating-heart {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="stars" aria-hidden="true">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <main class="app">

    <header class="header">

      <div>
        <div class="hello-small">
          Eşşek
        </div>

        <h1 class="hello-title">
          Esila bacım içindir
        </h1>
      </div>

      <button
        class="theme-btn"
        id="themeButton"
        type="button"
        onclick="toggleTheme()"
        aria-label="Tema değiştir"
      >
        🌙
      </button>

    </header>

    <section class="clock-card">

      <div
        class="clock"
        id="clock"
      >
        00:00:00
      </div>

      <div
        class="date"
        id="date"
      >
        Tarih yükleniyor...
      </div>

      <div class="timezone">
        Türkiye saati
      </div>

    </section>

    <section class="health-card">

      <div class="health-title">
        Bugün nasılsın?
      </div>

      <div class="health-buttons">

        <button
          class="health-btn"
          id="goodBtn"
          type="button"
          onclick="setHealth('good')"
        >
          <span class="health-emoji">😊</span>

          <span class="health-label">
            İyiyim
          </span>

          <span class="health-sub">
            keyfim yerinde
          </span>
        </button>

        <button
          class="health-btn"
          id="badBtn"
          type="button"
          onclick="setHealth('bad')"
        >
          <span class="health-emoji">🥺</span>

          <span class="health-label">
            İyi değilim
          </span>

          <span class="health-sub">
            biraz kötüyüm
          </span>
        </button>

      </div>

    </section>

    <div class="section-head">

      <div class="section-title">
        İlaçlar
      </div>

      <div
        class="section-date"
        id="sectionDate"
      ></div>

    </div>

    <section class="medicines">

      <article
        class="medicine"
        id="betasercCard"
      >

        <div class="med-icon betaserc-icon">
          💗
        </div>

        <div class="med-content">

          <div class="med-name">
            Betaserc
          </div>

          <div
            class="med-desc"
            id="betasercDesc"
          >
            İyiyken sabah kullan.
          </div>

          <div class="dose-list">

            <div class="dose">

              <div class="dose-info">
                Sabah
              </div>

              <button
                class="take"
                id="betasercMorning"
                type="button"
                onclick="
                  toggleDose(
                    'betasercMorning',
                    this
                  )
                "
              >
                Aldım
              </button>

            </div>

            <div
              class="dose"
              id="eveningDose"
              style="display:none;"
            >

              <div class="dose-info">
                Akşam
              </div>

              <button
                class="take"
                id="betasercEvening"
                type="button"
                onclick="
                  toggleDose(
                    'betasercEvening',
                    this
                  )
                "
              >
                Aldım
              </button>

            </div>

          </div>

        </div>

        <div></div>

      </article>

      <article
        class="medicine"
        id="citolesCard"
      >

        <div class="med-icon citoles-icon">
          🌿
        </div>

        <div class="med-content">

          <div class="med-name">
            Citoles
          </div>

          <div class="med-desc">
            Sabah içmeyi unutma.
          </div>

        </div>

        <button
          class="take single-take"
          id="citoles"
          type="button"
          onclick="
            toggleMedicine(
              'citoles',
              this
            )
          "
        >
          Aldım
        </button>

      </article>

      <article
        class="medicine"
        id="b12Card"
      >

        <div class="med-icon b12-icon">
          🧡
        </div>

        <div class="med-content">

          <div class="med-name">
            B12
          </div>

          <div class="med-desc">
            Tok karnına, günde 1 defa.
          </div>

        </div>

        <button
          class="take single-take"
          id="b12"
          type="button"
          onclick="
            toggleMedicine(
              'b12',
              this
            )
          "
        >
          Aldım
        </button>

      </article>

    </section>

    <section class="progress-card">

      <div class="progress-head">

        <div class="progress-title">
          Bugünkü durum
        </div>

        <div
          class="progress-count"
          id="progressCount"
        >
          0 / 3
        </div>

      </div>

      <div
        class="hearts-progress"
        id="heartProgress"
      ></div>

      <div
        class="complete"
        id="complete"
      >
        Bugünlük tamamdır Esila bacım.
        <br>
        Aferin sana.
      </div>

    </section>

    <div class="reset-area">

      <button
        class="reset-btn"
        type="button"
        onclick="resetToday()"
      >
        Bugünü sıfırla
      </button>

    </div>

  </main>

  <div
    class="toast"
    id="toast"
  ></div>

  <script>
    function turkeyDateKey() {
      const parts =
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone: "Europe/Istanbul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }
        ).formatToParts(new Date());

      const values = {};

      parts.forEach(part => {
        if (part.type !== "literal") {
          values[part.type] =
            part.value;
        }
      });

      return (
        values.year +
        "-" +
        values.month +
        "-" +
        values.day
      );
    }

    function storageKey() {
      return "esila_" +
        turkeyDateKey();
    }

    function defaultData() {
      return {
        health: "good",

        doses: {
          betasercMorning: false,
          betasercEvening: false,
          citoles: false,
          b12: false
        }
      };
    }

    function getData() {
      const saved =
        localStorage.getItem(
          storageKey()
        );

      if (!saved) {
        return defaultData();
      }

      try {
        const parsed =
          JSON.parse(saved);

        return {
          health:
            parsed.health === "bad"
              ? "bad"
              : "good",

          doses: {
            ...defaultData().doses,
            ...(parsed.doses || {})
          }
        };

      } catch {
        return defaultData();
      }
    }

    function saveData() {
      localStorage.setItem(
        storageKey(),
        JSON.stringify(data)
      );
    }

    let data = getData();

    function updateClock() {
      const now = new Date();

      const time =
        now.toLocaleTimeString(
          "tr-TR",
          {
            timeZone:
              "Europe/Istanbul",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: false
          }
        );

      const date =
        now.toLocaleDateString(
          "tr-TR",
          {
            timeZone:
              "Europe/Istanbul",

            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      document
        .getElementById("clock")
        .textContent = time;

      document
        .getElementById("date")
        .textContent =
        date.charAt(0).toUpperCase() +
        date.slice(1);

      document
        .getElementById("sectionDate")
        .textContent =
        date;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    function setHealth(status) {
      data.health = status;

      saveData();

      updateHealth();
      updateBetaserc();
      updateProgress();
    }

    function updateHealth() {
      document
        .getElementById("goodBtn")
        .classList.toggle(
          "active",
          data.health === "good"
        );

      document
        .getElementById("badBtn")
        .classList.toggle(
          "active",
          data.health === "bad"
        );
    }

    function updateBetaserc() {
      const evening =
        document.getElementById(
          "eveningDose"
        );

      const description =
        document.getElementById(
          "betasercDesc"
        );

      if (data.health === "bad") {

        evening.style.display =
          "grid";

        description.textContent =
          "İyi değilsen sabah ve akşam kullan.";

      } else {

        evening.style.display =
          "none";

        description.textContent =
          "İyiyken sabah kullan.";
      }

      updateDoseButtons();
    }

    function toggleDose(
      name,
      button
    ) {
      const wasDone =
        data.doses[name];

      data.doses[name] =
        !wasDone;

      saveData();

      updateDoseButtons();
      updateProgress();

      if (!wasDone) {
        createHearts(button);
      }
    }

    function updateDoseButtons() {

      updateButton(
        "betasercMorning",
        data.doses.betasercMorning
      );

      updateButton(
        "betasercEvening",
        data.doses.betasercEvening
      );

      const complete =
        data.doses.betasercMorning &&
        (
          data.health === "good" ||
          data.doses.betasercEvening
        );

      document
        .getElementById("betasercCard")
        .classList.toggle(
          "done-card",
          complete
        );
    }

    function toggleMedicine(
      name,
      button
    ) {
      const wasDone =
        data.doses[name];

      data.doses[name] =
        !wasDone;

      saveData();

      updateMedicineButtons();
      updateProgress();

      if (!wasDone) {
        createHearts(button);
      }
    }

    function updateMedicineButtons() {

      updateButton(
        "citoles",
        data.doses.citoles
      );

      updateButton(
        "b12",
        data.doses.b12
      );

      document
        .getElementById("citolesCard")
        .classList.toggle(
          "done-card",
          data.doses.citoles
        );

      document
        .getElementById("b12Card")
        .classList.toggle(
          "done-card",
          data.doses.b12
        );
    }

    function updateButton(
      id,
      done
    ) {
      const button =
        document.getElementById(id);

      if (!button) return;

      button.classList.toggle(
        "done",
        done
      );

      button.textContent =
        done
          ? "✓ Alındı"
          : "Aldım";
    }

    function createHearts(button) {
      const rect =
        button.getBoundingClientRect();

      const hearts = [
        "💗",
        "💕",
        "💖",
        "🌸",
        "✨"
      ];

      for (let i = 0; i < 8; i++) {

        const heart =
          document.createElement(
            "div"
          );

        heart.className =
          "floating-heart";

        heart.textContent =
          hearts[
            Math.floor(
              Math.random() *
              hearts.length
            )
          ];

        heart.style.left =
          (
            rect.left +
            rect.width / 2
          ) + "px";

        heart.style.top =
          (
            rect.top +
            rect.height / 2
          ) + "px";

        heart.style.setProperty(
          "--x",
          (
            Math.random() * 100 -
            50
          ) + "px"
        );

        heart.style.setProperty(
          "--r",
          (
            Math.random() * 60 -
            30
          ) + "deg"
        );

        heart.style.animationDelay =
          (
            Math.random() * .15
          ) + "s";

        document.body.appendChild(
          heart
        );

        setTimeout(
          () => heart.remove(),
          1400
        );
      }
    }

    function updateProgress() {

      const total =
        data.health === "bad"
          ? 4
          : 3;

      let completed = 0;

      if (
        data.doses.betasercMorning
      ) {
        completed++;
      }

      if (
        data.health === "bad" &&
        data.doses.betasercEvening
      ) {
        completed++;
      }

      if (data.doses.citoles) {
        completed++;
      }

      if (data.doses.b12) {
        completed++;
      }

      const container =
        document.getElementById(
          "heartProgress"
        );

      container.innerHTML = "";

      for (let i = 0; i < total; i++) {

        const heart =
          document.createElement(
            "span"
          );

        heart.className =
          "progress-heart";

        heart.textContent =
          i < completed
            ? "♥"
            : "♡";

        if (i < completed) {
          heart.classList.add(
            "active"
          );
        }

        container.appendChild(
          heart
        );
      }

      document
        .getElementById(
          "progressCount"
        )
        .textContent =
        completed +
        " / " +
        total;

      document
        .getElementById(
          "complete"
        )
        .classList.toggle(
          "show",
          completed === total
        );
    }

    function toggleTheme() {

      const dark =
        document.body.classList.toggle(
          "dark"
        );

      localStorage.setItem(
        "esila_theme",
        dark
          ? "dark"
          : "light"
      );

      document
        .getElementById(
          "themeButton"
        )
        .textContent =
        dark
          ? "☀️"
          : "🌙";
    }

    function loadTheme() {

      const theme =
        localStorage.getItem(
          "esila_theme"
        );

      if (theme === "dark") {

        document.body
          .classList
          .add("dark");

        document
          .getElementById(
            "themeButton"
          )
          .textContent =
          "☀️";
      }
    }

    function resetToday() {

      const confirmed =
        confirm(
          "Bugünün ilaç kayıtları sıfırlansın mı?"
        );

      if (!confirmed) {
        return;
      }

      localStorage.removeItem(
        storageKey()
      );

      data = defaultData();

      refresh();

      showToast(
        "Bugünün kayıtları sıfırlandı."
      );
    }

    let currentDay =
      turkeyDateKey();

    setInterval(() => {

      const newDay =
        turkeyDateKey();

      if (newDay !== currentDay) {

        currentDay = newDay;

        data = getData();

        refresh();
      }

    }, 1000);

    let toastTimer;

    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(
        toastTimer
      );

      toastTimer =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 1800);
    }

    function refresh() {
      updateHealth();
      updateBetaserc();
      updateMedicineButtons();
      updateProgress();
      updateClock();
    }

    loadTheme();
    refresh();
  </script>

</body>
</html>
