<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eşşek</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #151114;
    color: #fff1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    left: -20px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #f3aec2;
    box-shadow: 0 0 6px #f3aec2;
    opacity: .7;
    animation: starMove linear infinite;
}

.star:nth-child(1)  { top: 8%;  animation-duration: 13s; animation-delay: -4s; }
.star:nth-child(2)  { top: 16%; animation-duration: 19s; animation-delay: -11s; width: 2px; height: 2px; }
.star:nth-child(3)  { top: 25%; animation-duration: 15s; animation-delay: -7s; }
.star:nth-child(4)  { top: 34%; animation-duration: 22s; animation-delay: -16s; width: 2px; height: 2px; }
.star:nth-child(5)  { top: 43%; animation-duration: 14s; animation-delay: -3s; }
.star:nth-child(6)  { top: 51%; animation-duration: 20s; animation-delay: -13s; width: 2px; height: 2px; }
.star:nth-child(7)  { top: 60%; animation-duration: 17s; animation-delay: -9s; width: 4px; height: 4px; }
.star:nth-child(8)  { top: 68%; animation-duration: 13s; animation-delay: -5s; width: 2px; height: 2px; }
.star:nth-child(9)  { top: 76%; animation-duration: 21s; animation-delay: -17s; }
.star:nth-child(10) { top: 84%; animation-duration: 16s; animation-delay: -8s; width: 2px; height: 2px; }
.star:nth-child(11) { top: 91%; animation-duration: 23s; animation-delay: -20s; }
.star:nth-child(12) { top: 12%; animation-duration: 18s; animation-delay: -14s; width: 2px; height: 2px; }

@keyframes starMove {
    from {
        transform: translateX(-30px);
        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    90% {
        opacity: .7;
    }

    to {
        transform: translateX(calc(100vw + 50px));
        opacity: 0;
    }
}

.app {
    position: relative;
    z-index: 1;
    width: calc(100% - 24px);
    max-width: 575px;
    margin: auto;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
}

.header {
    padding: 4px 2px 16px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 900;
}

.clock-card,
.health-card,
.medicine,
.progress-card {
    background: #211a1e;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

.clock-card {
    padding: 23px 12px 18px;
    text-align: center;
    border-radius: 22px;
}

.clock {
    font-size: clamp(42px, 12vw, 62px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -2px;
    color: #e9a3b9;
    font-variant-numeric: tabular-nums;
}

.date {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 800;
}

.timezone {
    margin-top: 4px;
    color: #9d8b92;
    font-size: 8px;
}

.health-card {
    margin-top: 13px;
    padding: 15px;
    border-radius: 20px;
}

.health-title {
    margin-bottom: 9px;
    font-size: 12px;
    font-weight: 900;
}

.health-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.health-btn {
    min-height: 51px;
    border: 1px solid transparent;
    border-radius: 13px;
    background: #281f24;
    color: #fff1f5;
    cursor: pointer;
}

.health-btn.active {
    background: #392a31;
    border-color: #805363;
    color: #eca9bd;
}

.health-label,
.health-sub {
    display: block;
}

.health-label {
    font-size: 10px;
    font-weight: 900;
}

.health-sub {
    margin-top: 3px;
    color: #9e8b92;
    font-size: 7px;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 17px 3px 9px;
}

.section-title {
    font-size: 14px;
    font-weight: 900;
}

.section-date {
    color: #918087;
    font-size: 8px;
}

.medicines {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.medicine {
    display: grid;
    grid-template-columns: 43px minmax(0, 1fr) 90px;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border-radius: 18px;
}

.med-icon {
    width: 43px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    font-size: 18px;
}

.bet-icon {
    background: rgba(216,137,161,.13);
}

.cit-icon {
    background: rgba(111,178,143,.12);
}

.b12-icon {
    background: rgba(235,165,101,.12);
}

.med-content {
    min-width: 0;
}

.med-name {
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 900;
}

.med-desc {
    color: #a39299;
    font-size: 8px;
    line-height: 1.4;
}

.dose-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
}

.dose-row {
    min-height: 31px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    border-radius: 9px;
    background: rgba(216,137,161,.07);
    color: #a9979e;
    font-size: 8px;
    font-weight: 800;
}

.action-column {
    width: 90px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.take {
    width: 90px;
    height: 37px;
    border: 0;
    border-radius: 10px;
    background: #d5849d;
    color: white;
    font-size: 9px;
    font-weight: 900;
    cursor: pointer;
    transition: .15s;
}

.take:active {
    transform: scale(.95);
}

.take.done {
    background: #6fae8c;
}

.progress-card {
    margin-top: 12px;
    padding: 13px 15px;
    border-radius: 17px;
}

.progress-head {
    display: flex;
    justify-content: space-between;
}

.progress-title {
    font-size: 10px;
    font-weight: 900;
}

.progress-count {
    color: #e7a2b8;
    font-size: 9px;
    font-weight: 900;
}

.hearts {
    display: flex;
    gap: 4px;
    margin-top: 7px;
}

.progress-heart {
    color: #5f4b53;
    font-size: 15px;
}

.progress-heart.active {
    color: #e7a2b8;
}

.complete {
    display: none;
    margin-top: 8px;
    padding: 8px;
    border-radius: 9px;
    background: rgba(111,174,140,.1);
    color: #91c8a8;
    text-align: center;
    font-size: 8px;
    font-weight: 800;
}

.complete.show {
    display: block;
}

.reset-area {
    text-align: center;
    margin-top: 10px;
}

.reset-btn {
    padding: 5px 8px;
    border: 0;
    background: transparent;
    color: #76666c;
    font-size: 7px;
    text-decoration: underline;
    cursor: pointer;
}

.floating-heart {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    color: #ec9fb7;
    font-size: 17px;
    animation: heartFloat 1.1s ease-out forwards;
}

@keyframes heartFloat {
    from {
        opacity: 0;
        transform: translate(0,0) scale(.5);
    }

    15% {
        opacity: 1;
    }

    to {
        opacity: 0;
        transform: translate(var(--moveX), -90px) rotate(var(--rotate));
    }
}

@media (max-width: 390px) {
    .app {
        width: calc(100% - 18px);
    }

    .medicine {
        grid-template-columns: 39px minmax(0,1fr) 78px;
        gap: 8px;
        padding: 11px;
    }

    .med-icon {
        width: 39px;
        height: 39px;
    }

    .action-column,
    .take {
        width: 78px;
    }

    .clock {
        font-size: 42px;
    }
}

@media (max-width: 350px) {
    .medicine {
        grid-template-columns: 36px minmax(0,1fr) 72px;
    }

    .med-icon {
        width: 36px;
        height: 36px;
    }

    .action-column,
    .take {
        width: 72px;
    }
}
</style>
</head>

<body>

<div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
</div>

<main class="app">

    <header class="header">
        <h1>Eşşek</h1>
    </header>

    <section class="clock-card">
        <div id="clock" class="clock">00:00:00</div>
        <div id="date" class="date">Tarih</div>
        <div class="timezone">Türkiye saati</div>
    </section>

    <section class="health-card">
        <div class="health-title">Bugün nasılsın?</div>

        <div class="health-buttons">
            <button id="goodBtn" class="health-btn" onclick="setHealth('good')">
                <span class="health-label">İyiyim</span>
                <span class="health-sub">keyfim yerinde</span>
            </button>

            <button id="badBtn" class="health-btn" onclick="setHealth('bad')">
                <span class="health-label">İyi değilim</span>
                <span class="health-sub">biraz kötüyüm</span>
            </button>
        </div>
    </section>

    <div class="section-head">
        <div class="section-title">İlaçlar</div>
        <div id="sectionDate" class="section-date"></div>
    </div>

    <section class="medicines">

        <article class="medicine">
            <div class="med-icon bet-icon">💗</div>

            <div class="med-content">
                <div class="med-name">Betaserc</div>

                <div id="betasercDesc" class="med-desc">
                    İyiyken sabah kullan.
                </div>

                <div class="dose-list">
                    <div class="dose-row">Sabah</div>

                    <div id="eveningRow" class="dose-row" style="display:none">
                        Akşam
                    </div>
                </div>
            </div>

            <div class="action-column">
                <button
                    id="betasercMorning"
                    class="take"
                    onclick="toggleDose('betasercMorning', this)"
                >
                    Aldım
                </button>

                <button
                    id="betasercEvening"
                    class="take"
                    style="display:none"
                    onclick="toggleDose('betasercEvening', this)"
                >
                    Aldım
                </button>
            </div>
        </article>

        <article class="medicine">
            <div class="med-icon cit-icon">🌿</div>

            <div class="med-content">
                <div class="med-name">Citoles</div>
                <div class="med-desc">Sabah içmeyi unutma.</div>
            </div>

            <div class="action-column">
                <button
                    id="citoles"
                    class="take"
                    onclick="toggleDose('citoles', this)"
                >
                    Aldım
                </button>
            </div>
        </article>

        <article class="medicine">
            <div class="med-icon b12-icon">🧡</div>

            <div class="med-content">
                <div class="med-name">B12</div>
                <div class="med-desc">Tok karnına, günde 1 defa.</div>
            </div>

            <div class="action-column">
                <button
                    id="b12"
                    class="take"
                    onclick="toggleDose('b12', this)"
                >
                    Aldım
                </button>
            </div>
        </article>

    </section>

    <section class="progress-card">
        <div class="progress-head">
            <div class="progress-title">Bugünkü durum</div>
            <div id="progressCount" class="progress-count">0 / 3</div>
        </div>

        <div id="hearts" class="hearts"></div>

        <div id="complete" class="complete">
            Bugünlük tamamdır.
        </div>
    </section>

    <div class="reset-area">
        <button class="reset-btn" onclick="resetToday()">
            Bugünü sıfırla
        </button>
    </div>

</main>

<script>
function todayKey() {
    return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Istanbul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).format(new Date());
}

function newData() {
    return {
        health: "good",
        doses: {
            betasercMorning: false,
            betasercEvening: false,
            citoles: false,
            b12: false
        }
    };
}

function getData() {
    const saved = localStorage.getItem("esek_" + todayKey());

    if (!saved) return newData();

    try {
        return JSON.parse(saved);
    } catch {
        return newData();
    }
}

let data = getData();
let currentDay = todayKey();

function save() {
    localStorage.setItem("esek_" + todayKey(), JSON.stringify(data));
}

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("tr-TR", {
            timeZone: "Europe/Istanbul",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });

    const date = now.toLocaleDateString("tr-TR", {
        timeZone: "Europe/Istanbul",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("date").textContent = date;
    document.getElementById("sectionDate").textContent = date;
}

function setHealth(value) {
    data.health = value;
    save();
    render();
}

function setButton(id, done) {
    const button = document.getElementById(id);

    if (!button) return;

    button.classList.toggle("done", done);
    button.textContent = done ? "✓ Alındı" : "Aldım";
}

function updateBetaserc() {
    const bad = data.health === "bad";

    document.getElementById("eveningRow").style.display =
        bad ? "flex" : "none";

    document.getElementById("betasercEvening").style.display =
        bad ? "block" : "none";

    document.getElementById("betasercDesc").textContent =
        bad
            ? "İyi değilsen sabah ve akşam kullan."
            : "İyiyken sabah kullan.";

    setButton("betasercMorning", data.doses.betasercMorning);
    setButton("betasercEvening", data.doses.betasercEvening);
}

function toggleDose(name, button) {
    const oldValue = data.doses[name];

    data.doses[name] = !oldValue;
    save();
    render();

    if (!oldValue) {
        makeHearts(button);
    }
}

function updateProgress() {
    const bad = data.health === "bad";
    const total = bad ? 4 : 3;

    let done = 0;

    if (data.doses.betasercMorning) done++;
    if (data.doses.citoles) done++;
    if (data.doses.b12) done++;

    if (bad && data.doses.betasercEvening) {
        done++;
    }

    document.getElementById("progressCount").textContent =
        done + " / " + total;

    const hearts = document.getElementById("hearts");
    hearts.innerHTML = "";

    for (let i = 0; i < total; i++) {
        const heart = document.createElement("span");

        heart.className =
            "progress-heart" + (i < done ? " active" : "");

        heart.textContent = i < done ? "♥" : "♡";

        hearts.appendChild(heart);
    }

    document.getElementById("complete")
        .classList.toggle("show", done === total);
}

function updateHealthButtons() {
    document.getElementById("goodBtn")
        .classList.toggle("active", data.health === "good");

    document.getElementById("badBtn")
        .classList.toggle("active", data.health === "bad");
}

function makeHearts(button) {
    const rect = button.getBoundingClientRect();

    for (let i = 0; i < 6; i++) {
        const heart = document.createElement("span");

        heart.className = "floating-heart";
        heart.textContent = Math.random() > .25 ? "♥" : "✦";

        heart.style.left =
            rect.left + rect.width / 2 + "px";

        heart.style.top =
            rect.top + rect.height / 2 + "px";

        heart.style.setProperty(
            "--moveX",
            Math.random() * 80 - 40 + "px"
        );

        heart.style.setProperty(
            "--rotate",
            Math.random() * 50 - 25 + "deg"
        );

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 1200);
    }
}

function resetToday() {
    if (!confirm("Bugünün kayıtları sıfırlansın mı?")) return;

    localStorage.removeItem("esek_" + todayKey());
    data = newData();
    render();
}

function render() {
    updateHealthButtons();
    updateBetaserc();

    setButton("citoles", data.doses.citoles);
    setButton("b12", data.doses.b12);

    updateProgress();
}

updateClock();
setInterval(updateClock, 1000);

setInterval(() => {
    const today = todayKey();

    if (today !== currentDay) {
        currentDay = today;
        data = getData();
        render();
    }
}, 1000);

render();
</script>

</body>
</html>
