<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171317">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Eşşek</title>

  <style>
    :root {
      --bg: #171317;
      --card: rgba(39, 29, 35, 0.94);
      --card2: #30242a;

      --text: #fff1f5;
      --muted: #bda8b0;

      --pink: #dc91a8;
      --pink-dark: #eea9bd;
      --pink-light: rgba(220, 145, 168, .15);

      --green: #72b997;
      --green-dark: #98d2b3;

      --border: rgba(255,255,255,.07);
      --shadow: 0 10px 30px rgba(0,0,0,.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(220,145,168,.13),
          transparent 42%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    /* =========================
       KAYAN YILDIZLAR
    ========================= */

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #f1b9c8;

      opacity: .4;

      box-shadow:
        0 0 7px rgba(241,185,200,.65);

      animation:
        starMove var(--duration) linear infinite,
        starBlink var(--blink) ease-in-out infinite;
    }

    .star:nth-child(1) {
      left: 7%;
      top: 15%;
      --duration: 12s;
      --blink: 2.5s;
      --dx: 90px;
      --dy: -45px;
    }

    .star:nth-child(2) {
      left: 18%;
      top: 55%;
      width: 2px;
      height: 2px;
      --duration: 16s;
      --blink: 3s;
      --dx: -80px;
      --dy: -65px;
    }

    .star:nth-child(3) {
      left: 31%;
      top: 25%;
      width: 4px;
      height: 4px;
      --duration: 18s;
      --blink: 2.8s;
      --dx: 75px;
      --dy: 80px;
    }

    .star:nth-child(4) {
      left: 43%;
      top: 78%;
      width: 2px;
      height: 2px;
      --duration: 14s;
      --blink: 3.4s;
      --dx: -90px;
      --dy: -40px;
    }

    .star:nth-child(5) {
      left: 56%;
      top: 12%;
      width: 4px;
      height: 4px;
      --duration: 20s;
      --blink: 2.7s;
      --dx: 100px;
      --dy: 55px;
    }

    .star:nth-child(6) {
      left: 68%;
      top: 48%;
      width: 2px;
      height: 2px;
      --duration: 13s;
      --blink: 3.1s;
      --dx: -70px;
      --dy: 75px;
    }

    .star:nth-child(7) {
      left: 79%;
      top: 20%;
      width: 4px;
      height: 4px;
      --duration: 17s;
      --blink: 2.6s;
      --dx: 65px;
      --dy: -70px;
    }

    .star:nth-child(8) {
      left: 91%;
      top: 67%;
      width: 3px;
      height: 3px;
      --duration: 15s;
      --blink: 3.3s;
      --dx: -100px;
      --dy: 45px;
    }

    .star:nth-child(9) {
      left: 12%;
      top: 86%;
      width: 3px;
      height: 3px;
      --duration: 19s;
      --blink: 2.9s;
      --dx: 80px;
      --dy: -85px;
    }

    .star:nth-child(10) {
      left: 48%;
      top: 43%;
      width: 2px;
      height: 2px;
      --duration: 11s;
      --blink: 3.5s;
      --dx: -60px;
      --dy: 60px;
    }

    .star:nth-child(11) {
      left: 73%;
      top: 88%;
      width: 3px;
      height: 3px;
      --duration: 21s;
      --blink: 2.4s;
      --dx: 90px;
      --dy: -55px;
    }

    .star:nth-child(12) {
      left: 36%;
      top: 62%;
      width: 4px;
      height: 4px;
      --duration: 16s;
      --blink: 3.2s;
      --dx: -75px;
      --dy: -75px;
    }

    @keyframes starMove {
      0% {
        transform: translate3d(0,0,0);
      }

      50% {
        transform:
          translate3d(
            var(--dx),
            var(--dy),
            0
          );
      }

      100% {
        transform: translate3d(0,0,0);
      }
    }

    @keyframes starBlink {
      0%, 100% {
        opacity: .18;
      }

      50% {
        opacity: .75;
      }
    }

    /* =========================
       ANA KUTU
    ========================= */

    .app {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding:
        max(15px, env(safe-area-inset-top))
        15px
        max(28px, env(safe-area-inset-bottom));
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 6px 2px 16px;
    }

    .hello {
      margin: 0;

      font-size: 25px;
      font-weight: 900;

      letter-spacing: -.6px;
    }

    /* =========================
       SAAT
    ========================= */

    .clock-card {
      padding: 20px 14px;

      margin-bottom: 14px;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: var(--card);

      box-shadow: var(--shadow);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .clock {
      font-size: clamp(43px, 14vw, 65px);

      line-height: 1;

      font-weight: 900;

      color: var(--pink-dark);

      font-variant-numeric: tabular-nums;

      letter-spacing: .5px;
    }

    .date {
      margin-top: 9px;

      font-size: 13px;
      font-weight: 750;
    }

    .timezone {
      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;
    }

    /* =========================
       SAĞLIK
    ========================= */

    .health-card {
      padding: 16px;

      margin-bottom: 17px;

      border: 1px solid var(--border);
      border-radius: 22px;

      background: var(--card);

      box-shadow: var(--shadow);
    }

    .health-title {
      margin-bottom: 10px;

      font-size: 14px;
      font-weight: 850;
    }

    .health-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 9px;
    }

    .health-btn {
      min-height: 52px;

      border: 1px solid transparent;
      border-radius: 14px;

      background: var(--card2);
      color: var(--text);

      cursor: pointer;
    }

    .health-btn.active {
      background: var(--pink-light);

      border-color:
        rgba(220,145,168,.28);

      color: var(--pink-dark);
    }

    .health-label {
      display: block;

      font-size: 12px;
      font-weight: 850;
    }

    .health-sub {
      display: block;

      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
    }

    /* =========================
       BAŞLIK
    ========================= */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin:
        0 3px
        10px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 900;
    }

    .section-date {
      color: var(--muted);

      font-size: 9px;
      font-weight: 650;

      text-align: right;
    }

    /* =========================
       İLAÇ KARTLARI
    ========================= */

    .medicines {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .medicine {
      display: grid;

      /*
        SOL:
        ikon

        ORTA:
        ilaç bilgisi

        SAĞ:
        buton

        Böylece bütün kartların
        buton kolonları birebir
        aynı hizada kalıyor.
      */

      grid-template-columns:
        44px
        minmax(0, 1fr)
        82px;

      align-items: center;

      gap: 11px;

      width: 100%;

      padding: 13px;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background: var(--card);

      box-shadow: var(--shadow);

      min-width: 0;
    }

    .medicine.done-card {
      border-color:
        rgba(114,185,151,.25);
    }

    .med-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      font-size: 19px;
    }

    .betaserc-icon {
      background: rgba(220,145,168,.14);
    }

    .citoles-icon {
      background: rgba(114,185,151,.13);
    }

    .b12-icon {
      background: rgba(242,173,105,.13);
    }

    .med-content {
      min-width: 0;
    }

    .med-name {
      margin-bottom: 4px;

      font-size: 14px;
      font-weight: 900;
    }

    .med-desc {
      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;
    }

    /* =========================
       BETASERC DOZLARI
    ========================= */

    .dose-list {
      display: flex;
      flex-direction: column;

      gap: 6px;

      margin-top: 9px;
    }

    .dose {
      display: grid;

      /*
        Burada da sağdaki
        buton kolonunu sabitliyoruz.
      */

      grid-template-columns:
        minmax(0,1fr)
        82px;

      align-items: center;

      gap: 7px;

      min-height: 42px;

      padding: 5px 6px;

      border-radius: 11px;

      background:
        rgba(220,145,168,.09);
    }

    .dose-info {
      padding-left: 3px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 800;
    }

    /* =========================
       ALINDI BUTONU
    ========================= */

    .take {
      width: 82px;
      min-width: 82px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;
      border-radius: 10px;

      background: var(--pink);

      color: white;

      font-size: 9.5px;
      font-weight: 900;

      white-space: nowrap;

      cursor: pointer;

      transition:
        transform .15s ease,
        background .2s ease;
    }

    .take:active {
      transform: scale(.94);
    }

    .take.done {
      background: var(--green);
    }

    /* =========================
       İLERLEME
    ========================= */

    .progress-card {
      margin-top: 13px;

      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background: var(--card);

      box-shadow: var(--shadow);
    }

    .progress-head {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    .progress-title {
      font-size: 12px;
      font-weight: 850;
    }

    .progress-count {
      color: var(--pink-dark);

      font-size: 11px;
      font-weight: 900;
    }

    .hearts-progress {
      display: flex;
      gap: 4px;
    }

    .progress-heart {
      color: #674b55;
      font-size: 19px;
    }

    .progress-heart.active {
      color: var(--pink-dark);
    }

    .complete {
      display: none;

      margin-top: 10px;
      padding: 10px;

      border-radius: 12px;

      background:
        rgba(114,185,151,.12);

      color: var(--green-dark);

      text-align: center;

      font-size: 11px;
      font-weight: 850;
    }

    .complete.show {
      display: block;
    }

    /* =========================
       SIFIRLA
    ========================= */

    .reset-area {
      margin-top: 15px;

      text-align: center;
    }

    .reset-btn {
      border: 0;

      padding: 6px 10px;

      background: transparent;

      color: #9d858d;

      font-size: 9px;

      text-decoration: underline;
      text-underline-offset: 3px;

      cursor: pointer;
    }

    /* =========================
       KALPLER
    ========================= */

    .floating-heart {
      position: fixed;

      z-index: 9999;

      pointer-events: none;

      font-size: 18px;

      animation:
        floatHeart 1.1s ease-out forwards;
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;

        transform:
          translateY(8px)
          scale(.5);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translate(
            var(--x),
            -90px
          )
          scale(1.05)
          rotate(var(--r));
      }
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      z-index: 10000;

      left: 50%;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom)
        );

      transform:
        translate(-50%,20px);

      width: max-content;

      max-width:
        calc(100vw - 30px);

      padding: 10px 14px;

      border-radius: 14px;

      background:
        rgba(255,240,245,.95);

      color: #4b333c;

      font-size: 11px;
      font-weight: 800;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0);
    }

    /* =========================
       ÇOK DAR IPHONE
    ========================= */

    @media (max-width: 380px) {

      .app {
        padding-left: 11px;
        padding-right: 11px;
      }

      .medicine {
        grid-template-columns:
          40px
          minmax(0,1fr)
          76px;

        gap: 8px;

        padding: 11px;
      }

      .med-icon {
        width: 40px;
        height: 40px;
      }

      .take {
        width: 76px;
        min-width: 76px;
      }

      .dose {
        grid-template-columns:
          minmax(0,1fr)
          76px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .star,
      .floating-heart {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- KAYAN YILDIZLAR -->
  <div class="stars" aria-hidden="true">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <main class="app">

    <!-- BAŞLIK -->
    <header class="header">
      <h1 class="hello">Eşşek</h1>
    </header>

    <!-- SAAT -->
    <section class="clock-card">

      <div
        class="clock"
        id="clock"
      >
        00:00:00
      </div>

      <div
        class="date"
        id="date"
      >
        Tarih yükleniyor...
      </div>

      <div class="timezone">
        Türkiye saati
      </div>

    </section>

    <!-- NASILSIN -->
    <section class="health-card">

      <div class="health-title">
        Bugün nasılsın?
      </div>

      <div class="health-buttons">

        <button
          class="health-btn"
          id="goodBtn"
          type="button"
          onclick="setHealth('good')"
        >
          <span class="health-label">
            İyiyim
          </span>

          <span class="health-sub">
            keyfim yerinde
          </span>
        </button>

        <button
          class="health-btn"
          id="badBtn"
          type="button"
          onclick="setHealth('bad')"
        >
          <span class="health-label">
            İyi değilim
          </span>

          <span class="health-sub">
            biraz kötüyüm
          </span>
        </button>

      </div>

    </section>

    <!-- İLAÇLAR -->
    <div class="section-head">

      <div class="section-title">
        İlaçlar
      </div>

      <div
        class="section-date"
        id="sectionDate"
      ></div>

    </div>

    <section class="medicines">

      <!-- BETASERC -->
      <article
        class="medicine"
        id="betasercCard"
      >

        <div class="med-icon betaserc-icon">
          💗
        </div>

        <div class="med-content">

          <div class="med-name">
            Betaserc
          </div>

          <div
            class="med-desc"
            id="betasercDesc"
          >
            İyiyken sabah kullan.
          </div>

          <div class="dose-list">

            <div class="dose">

              <div class="dose-info">
                Sabah
              </div>

              <button
                class="take"
                id="betasercMorning"
                type="button"
                onclick="
                  toggleDose(
                    'betasercMorning',
                    this
                  )
                "
              >
                Aldım
              </button>

            </div>

            <div
              class="dose"
              id="eveningDose"
              style="display:none;"
            >

              <div class="dose-info">
                Akşam
              </div>

              <button
                class="take"
                id="betasercEvening"
                type="button"
                onclick="
                  toggleDose(
                    'betasercEvening',
                    this
                  )
                "
              >
                Aldım
              </button>

            </div>

          </div>

        </div>

        <div></div>

      </article>

      <!-- CITOLES -->
      <article
        class="medicine"
        id="citolesCard"
      >

        <div class="med-icon citoles-icon">
          🌿
        </div>

        <div class="med-content">

          <div class="med-name">
            Citoles
          </div>

          <div class="med-desc">
            Sabah içmeyi unutma.
          </div>

        </div>

        <button
          class="take"
          id="citoles"
          type="button"
          onclick="
            toggleMedicine(
              'citoles',
              this
            )
          "
        >
          Aldım
        </button>

      </article>

      <!-- B12 -->
      <article
        class="medicine"
        id="b12Card"
      >

        <div class="med-icon b12-icon">
          🧡
        </div>

        <div class="med-content">

          <div class="med-name">
            B12
          </div>

          <div class="med-desc">
            Tok karnına, günde 1 defa.
          </div>

        </div>

        <button
          class="take"
          id="b12"
          type="button"
          onclick="
            toggleMedicine(
              'b12',
              this
            )
          "
        >
          Aldım
        </button>

      </article>

    </section>

    <!-- İLERLEME -->
    <section class="progress-card">

      <div class="progress-head">

        <div class="progress-title">
          Bugünkü durum
        </div>

        <div
          class="progress-count"
          id="progressCount"
        >
          0 / 3
        </div>

      </div>

      <div
        class="hearts-progress"
        id="heartProgress"
      ></div>

      <div
        class="complete"
        id="complete"
      >
        Bugünlük tamamdır.
        <br>
        Aferin sana.
      </div>

    </section>

    <!-- KÜÇÜK SIFIRLA -->
    <div class="reset-area">

      <button
        class="reset-btn"
        type="button"
        onclick="resetToday()"
      >
        Bugünü sıfırla
      </button>

    </div>

  </main>

  <div
    class="toast"
    id="toast"
  ></div>

  <script>
    /*
      TÜRKİYE TARİH ANAHTARI
      Her gün 00:00 Türkiye saatinde
      yeni kayıt alanı oluşur.
    */

    function turkeyDateKey() {

      const parts =
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone: "Europe/Istanbul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }
        ).formatToParts(
          new Date()
        );

      const values = {};

      parts.forEach(part => {

        if (
          part.type !== "literal"
        ) {
          values[part.type] =
            part.value;
        }

      });

      return (
        values.year +
        "-" +
        values.month +
        "-" +
        values.day
      );
    }

    function storageKey() {
      return "esila_" +
        turkeyDateKey();
    }

    function defaultData() {

      return {
        health: "good",

        doses: {
          betasercMorning: false,
          betasercEvening: false,
          citoles: false,
          b12: false
        }
      };
    }

    function getData() {

      const saved =
        localStorage.getItem(
          storageKey()
        );

      if (!saved) {
        return defaultData();
      }

      try {

        const parsed =
          JSON.parse(saved);

        return {

          health:
            parsed.health === "bad"
              ? "bad"
              : "good",

          doses: {
            ...defaultData().doses,
            ...(parsed.doses || {})
          }

        };

      } catch {

        return defaultData();

      }
    }

    let data = getData();

    function saveData() {

      localStorage.setItem(
        storageKey(),
        JSON.stringify(data)
      );
    }

    /* =========================
       SAAT
    ========================= */

    function updateClock() {

      const now = new Date();

      const time =
        now.toLocaleTimeString(
          "tr-TR",
          {
            timeZone:
              "Europe/Istanbul",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: false
          }
        );

      const date =
        now.toLocaleDateString(
          "tr-TR",
          {
            timeZone:
              "Europe/Istanbul",

            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      document
        .getElementById("clock")
        .textContent = time;

      document
        .getElementById("date")
        .textContent =
        date.charAt(0).toUpperCase() +
        date.slice(1);

      document
        .getElementById("sectionDate")
        .textContent = date;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================
       SAĞLIK DURUMU
    ========================= */

    function setHealth(status) {

      data.health = status;

      saveData();

      updateHealth();
      updateBetaserc();
      updateProgress();
    }

    function updateHealth() {

      document
        .getElementById("goodBtn")
        .classList.toggle(
          "active",
          data.health === "good"
        );

      document
        .getElementById("badBtn")
        .classList.toggle(
          "active",
          data.health === "bad"
        );
    }

    function updateBetaserc() {

      const evening =
        document.getElementById(
          "eveningDose"
        );

      const description =
        document.getElementById(
          "betasercDesc"
        );

      if (
        data.health === "bad"
      ) {

        evening.style.display =
          "grid";

        description.textContent =
          "İyi değilsen sabah ve akşam kullan.";

      } else {

        evening.style.display =
          "none";

        description.textContent =
          "İyiyken sabah kullan.";
      }

      updateDoseButtons();
    }

    /* =========================
       BETASERC
    ========================= */

    function toggleDose(
      name,
      button
    ) {

      const wasDone =
        data.doses[name];

      data.doses[name] =
        !wasDone;

      saveData();

      updateDoseButtons();
      updateProgress();

      if (!wasDone) {
        createHearts(button);
      }
    }

    function updateDoseButtons() {

      updateButton(
        "betasercMorning",
        data.doses.betasercMorning
      );

      updateButton(
        "betasercEvening",
        data.doses.betasercEvening
      );

      const complete =
        data.doses.betasercMorning &&
        (
          data.health === "good" ||
          data.doses.betasercEvening
        );

      document
        .getElementById(
          "betasercCard"
        )
        .classList.toggle(
          "done-card",
          complete
        );
    }

    /* =========================
       DİĞER İLAÇLAR
    ========================= */

    function toggleMedicine(
      name,
      button
    ) {

      const wasDone =
        data.doses[name];

      data.doses[name] =
        !wasDone;

      saveData();

      updateMedicineButtons();
      updateProgress();

      if (!wasDone) {
        createHearts(button);
      }
    }

    function updateMedicineButtons() {

      updateButton(
        "citoles",
        data.doses.citoles
      );

      updateButton(
        "b12",
        data.doses.b12
      );

      document
        .getElementById(
          "citolesCard"
        )
        .classList.toggle(
          "done-card",
          data.doses.citoles
        );

      document
        .getElementById(
          "b12Card"
        )
        .classList.toggle(
          "done-card",
          data.doses.b12
        );
    }

    function updateButton(
      id,
      done
    ) {

      const button =
        document.getElementById(id);

      if (!button) return;

      button.classList.toggle(
        "done",
        done
      );

      button.textContent =
        done
          ? "✓ Alındı"
          : "Aldım";
    }

    /* =========================
       KALP ANİMASYONU
    ========================= */

    function createHearts(button) {

      const rect =
        button.getBoundingClientRect();

      const hearts = [
        "💗",
        "💕",
        "💖",
        "🌸",
        "✨"
      ];

      for (
        let i = 0;
        i < 8;
        i++
      ) {

        const heart =
          document.createElement(
            "div"
          );

        heart.className =
          "floating-heart";

        heart.textContent =
          hearts[
            Math.floor(
              Math.random() *
              hearts.length
            )
          ];

        heart.style.left =
          (
            rect.left +
            rect.width / 2
          ) + "px";

        heart.style.top =
          (
            rect.top +
            rect.height / 2
          ) + "px";

        heart.style.setProperty(
          "--x",
          (
            Math.random() * 100 -
            50
          ) + "px"
        );

        heart.style.setProperty(
          "--r",
          (
            Math.random() * 60 -
            30
          ) + "deg"
        );

        heart.style.animationDelay =
          (
            Math.random() * .15
          ) + "s";

        document.body.appendChild(
          heart
        );

        setTimeout(
          () => heart.remove(),
          1400
        );
      }
    }

    /* =========================
       İLERLEME
    ========================= */

    function updateProgress() {

      const total =
        data.health === "bad"
          ? 4
          : 3;

      let completed = 0;

      if (
        data.doses.betasercMorning
      ) {
        completed++;
      }

      if (
        data.health === "bad" &&
        data.doses.betasercEvening
      ) {
        completed++;
      }

      if (data.doses.citoles) {
        completed++;
      }

      if (data.doses.b12) {
        completed++;
      }

      const container =
        document.getElementById(
          "heartProgress"
        );

      container.innerHTML = "";

      for (
        let i = 0;
        i < total;
        i++
      ) {

        const heart =
          document.createElement(
            "span"
          );

        heart.className =
          "progress-heart";

        heart.textContent =
          i < completed
            ? "♥"
            : "♡";

        if (i < completed) {
          heart.classList.add(
            "active"
          );
        }

        container.appendChild(
          heart
        );
      }

      document
        .getElementById(
          "progressCount"
        )
        .textContent =
        completed +
        " / " +
        total;

      document
        .getElementById(
          "complete"
        )
        .classList.toggle(
          "show",
          completed === total
        );
    }

    /* =========================
       SIFIRLAMA
    ========================= */

    function resetToday() {

      const confirmed =
        confirm(
          "Bugünün ilaç kayıtları sıfırlansın mı?"
        );

      if (!confirmed) {
        return;
      }

      localStorage.removeItem(
        storageKey()
      );

      data = defaultData();

      refresh();

      showToast(
        "Bugünün kayıtları sıfırlandı."
      );
    }

    /* =========================
       GÜN DEĞİŞİMİ
    ========================= */

    let currentDay =
      turkeyDateKey();

    setInterval(() => {

      const newDay =
        turkeyDateKey();

      if (
        newDay !== currentDay
      ) {

        currentDay = newDay;

        data = getData();

        refresh();
      }

    }, 1000);

    /* =========================
       TOAST
    ========================= */

    let toastTimer;

    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(
        toastTimer
      );

      toastTimer =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 1800);
    }

    /* =========================
       BAŞLAT
    ========================= */

    function refresh() {

      updateHealth();
      updateBetaserc();
      updateMedicineButtons();
      updateProgress();
      updateClock();
    }

    refresh();
  </script>

</body>
</html>
