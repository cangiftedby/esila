<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Eşşek</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #171317;
    --card: #241d21;
    --card2: #2c2328;
    --text: #fff1f5;
    --muted: #b9a6ad;
    --pink: #d889a1;
    --pink-soft: rgba(216,137,161,.13);
    --green: #6fb28f;
    --border: rgba(255,255,255,.07);
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
}

body {
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x: hidden;
}

/* ==================================================
   YILDIZLAR
   Gerçekten ekran boyunca hareket ediyorlar.
================================================== */

.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    left: -20px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #f5b8c9;

    box-shadow:
        0 0 6px rgba(245,184,201,.9);

    opacity: 0;

    animation:
        starTravel linear infinite,
        starFade ease-in-out infinite alternate;
}

/*
   Her yıldız farklı yerden başlıyor,
   farklı hızla ve farklı yönde kayıyor.
*/

.star:nth-child(1) {
    top: 12%;
    animation-duration: 13s, 2.2s;
    animation-delay: -4s, -1s;
}

.star:nth-child(2) {
    top: 25%;
    width: 2px;
    height: 2px;
    animation-duration: 17s, 3s;
    animation-delay: -11s, -2s;
}

.star:nth-child(3) {
    top: 39%;
    width: 4px;
    height: 4px;
    animation-duration: 20s, 2.5s;
    animation-delay: -7s, -1s;
}

.star:nth-child(4) {
    top: 52%;
    width: 2px;
    height: 2px;
    animation-duration: 15s, 3.2s;
    animation-delay: -13s, -2s;
}

.star:nth-child(5) {
    top: 67%;
    width: 3px;
    height: 3px;
    animation-duration: 18s, 2.8s;
    animation-delay: -5s, -1.5s;
}

.star:nth-child(6) {
    top: 81%;
    width: 2px;
    height: 2px;
    animation-duration: 14s, 2.4s;
    animation-delay: -9s, -.8s;
}

.star:nth-child(7) {
    top: 18%;
    width: 2px;
    height: 2px;
    animation-duration: 22s, 3.5s;
    animation-delay: -18s, -2s;
}

.star:nth-child(8) {
    top: 74%;
    width: 4px;
    height: 4px;
    animation-duration: 19s, 2.7s;
    animation-delay: -14s, -1s;
}

.star:nth-child(9) {
    top: 46%;
    width: 2px;
    height: 2px;
    animation-duration: 16s, 3s;
    animation-delay: -2s, -2s;
}

.star:nth-child(10) {
    top: 90%;
    width: 3px;
    height: 3px;
    animation-duration: 21s, 2.6s;
    animation-delay: -16s, -1s;
}

@keyframes starTravel {
    from {
        transform:
            translate3d(-30px, 0, 0)
            rotate(0deg);
    }

    to {
        transform:
            translate3d(calc(100vw + 60px), -80px, 0)
            rotate(180deg);
    }
}

@keyframes starFade {
    from {
        opacity: .15;
    }

    to {
        opacity: .75;
    }
}

/* ==================================================
   UYGULAMA
================================================== */

.app {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 600px;

    margin: auto;

    padding:
        max(15px, env(safe-area-inset-top))
        14px
        max(25px, env(safe-area-inset-bottom));
}

/* ==================================================
   BAŞLIK
================================================== */

.header {
    padding: 5px 2px 15px;
}

.header h1 {
    margin: 0;

    font-size: 25px;
    font-weight: 900;

    letter-spacing: -.7px;
}

/* ==================================================
   SAAT
================================================== */

.clock-card {
    padding: 20px 12px;

    border-radius: 22px;

    background: var(--card);

    border: 1px solid var(--border);

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}

.clock {
    font-size: clamp(42px, 14vw, 62px);

    line-height: 1;

    font-weight: 900;

    color: #e9a7bb;

    font-variant-numeric: tabular-nums;
}

.date {
    margin-top: 9px;

    font-size: 13px;
    font-weight: 700;
}

.timezone {
    margin-top: 4px;

    color: var(--muted);

    font-size: 9px;
}

/* ==================================================
   NASILSIN
================================================== */

.health-card {
    margin-top: 13px;

    padding: 15px;

    border-radius: 20px;

    background: var(--card);

    border: 1px solid var(--border);
}

.health-title {
    margin-bottom: 9px;

    font-size: 13px;
    font-weight: 850;
}

.health-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.health-btn {
    min-height: 51px;

    border: 1px solid transparent;

    border-radius: 13px;

    background: var(--card2);

    color: var(--text);

    cursor: pointer;
}

.health-btn.active {
    background: var(--pink-soft);

    border-color:
        rgba(216,137,161,.3);

    color: #efaec1;
}

.health-label {
    display: block;

    font-size: 11px;
    font-weight: 850;
}

.health-sub {
    display: block;

    margin-top: 3px;

    color: var(--muted);

    font-size: 8px;
}

/* ==================================================
   İLAÇ BAŞLIĞI
================================================== */

.section-head {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin:
        17px 3px 9px;
}

.section-title {
    font-size: 15px;
    font-weight: 900;
}

.section-date {
    color: var(--muted);

    font-size: 8px;
}

/* ==================================================
   İLAÇ KARTLARI
================================================== */

.medicines {
    display: flex;
    flex-direction: column;

    gap: 9px;
}

/*
   EN ÖNEMLİ KISIM:

   Her kart:

   ikon | içerik | BUTON

   şeklinde.

   Sağdaki kolon her kartta tam olarak
   82px olduğu için butonlar aynı hizada.
*/

.medicine {
    display: grid;

    grid-template-columns:
        42px
        minmax(0, 1fr)
        82px;

    align-items: center;

    column-gap: 10px;

    width: 100%;

    padding: 12px;

    border-radius: 18px;

    background: var(--card);

    border: 1px solid var(--border);

    box-shadow:
        0 7px 22px rgba(0,0,0,.18);
}

.med-icon {
    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    font-size: 18px;
}

.bet-icon {
    background: rgba(216,137,161,.12);
}

.cit-icon {
    background: rgba(111,178,143,.12);
}

.b12-icon {
    background: rgba(235,165,101,.12);
}

.med-content {
    min-width: 0;
}

.med-name {
    font-size: 13px;
    font-weight: 900;

    margin-bottom: 4px;
}

.med-desc {
    color: var(--muted);

    font-size: 9px;

    line-height: 1.35;
}

/* ==================================================
   BETASERC SABAH / AKŞAM
================================================== */

/*
   Burada artık dose ayrı bir kolon sistemi
   kullanıyor.

   İçerik | 82px BUTON
*/

.dose-list {
    display: flex;
    flex-direction: column;

    gap: 6px;

    margin-top: 9px;
}

.dose {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        82px;

    align-items: center;

    column-gap: 7px;

    min-height: 40px;

    padding:
        3px 4px 3px 7px;

    border-radius: 10px;

    background:
        rgba(216,137,161,.07);
}

.dose-info {
    min-width: 0;

    color: var(--muted);

    font-size: 9px;
    font-weight: 750;
}

/* ==================================================
   BUTON
================================================== */

.take {
    width: 82px;
    min-width: 82px;

    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 0;

    border-radius: 10px;

    background: var(--pink);

    color: white;

    font-size: 9px;
    font-weight: 900;

    white-space: nowrap;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .2s ease;
}

.take:active {
    transform: scale(.94);
}

.take.done {
    background: var(--green);
}

/* ==================================================
   ALT DURUM
================================================== */

.progress-card {
    margin-top: 12px;

    padding: 13px 15px;

    border-radius: 17px;

    background: var(--card);

    border: 1px solid var(--border);
}

.progress-head {
    display: flex;

    align-items: center;
    justify-content: space-between;
}

.progress-title {
    font-size: 11px;
    font-weight: 850;
}

.progress-count {
    color: #e9a7bb;

    font-size: 10px;
    font-weight: 900;
}

.hearts {
    display: flex;

    gap: 4px;

    margin-top: 6px;
}

.progress-heart {
    color: #614b53;

    font-size: 17px;
}

.progress-heart.active {
    color: #e9a7bb;
}

.complete {
    display: none;

    margin-top: 8px;

    padding: 8px;

    border-radius: 10px;

    background:
        rgba(111,178,143,.1);

    color: #91c8a9;

    text-align: center;

    font-size: 9px;
    font-weight: 800;
}

.complete.show {
    display: block;
}

/* ==================================================
   SIFIRLA
================================================== */

.reset-area {
    text-align: center;

    margin-top: 12px;
}

.reset-btn {
    border: 0;

    padding: 5px 8px;

    background: transparent;

    color: #88747c;

    font-size: 8px;

    text-decoration: underline;

    cursor: pointer;
}

/* ==================================================
   KALPLER
================================================== */

.floating-heart {
    position: fixed;

    z-index: 999;

    pointer-events: none;

    font-size: 17px;

    animation:
        heartFloat 1.1s ease-out forwards;
}

@keyframes heartFloat {

    0% {
        opacity: 0;

        transform:
            translate(0, 0)
            scale(.5);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--moveX),
                -90px
            )
            rotate(var(--rotate))
            scale(1);
    }
}

/* ==================================================
   TOAST
================================================== */

.toast {
    position: fixed;

    left: 50%;
    bottom: 18px;

    z-index: 1000;

    transform:
        translate(-50%, 20px);

    padding: 9px 13px;

    border-radius: 12px;

    background: #fff0f4;

    color: #49333b;

    font-size: 10px;
    font-weight: 800;

    opacity: 0;

    pointer-events: none;

    transition:
        .2s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* ==================================================
   KÜÇÜK IPHONE
================================================== */

@media (max-width: 380px) {

    .app {
        padding-left: 10px;
        padding-right: 10px;
    }

    .medicine {
        grid-template-columns:
            38px
            minmax(0, 1fr)
            76px;

        column-gap: 8px;

        padding: 11px;
    }

    .med-icon {
        width: 38px;
        height: 38px;
    }

    .take {
        width: 76px;
        min-width: 76px;
    }

    .dose {
        grid-template-columns:
            minmax(0,1fr)
            76px;
    }
}

@media (prefers-reduced-motion: reduce) {

    .star,
    .floating-heart {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- ==================================================
     YILDIZLAR
================================================== -->

<div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
</div>

<main class="app">

    <header class="header">
        <h1>Eşşek</h1>
    </header>

    <!-- SAAT -->

    <section class="clock-card">

        <div
            class="clock"
            id="clock"
        >
            00:00:00
        </div>

        <div
            class="date"
            id="date"
        >
            Tarih
        </div>

        <div class="timezone">
            Türkiye saati
        </div>

    </section>

    <!-- DURUM -->

    <section class="health-card">

        <div class="health-title">
            Bugün nasılsın?
        </div>

        <div class="health-buttons">

            <button
                class="health-btn"
                id="goodBtn"
                onclick="setHealth('good')"
            >
                <span class="health-label">
                    İyiyim
                </span>

                <span class="health-sub">
                    keyfim yerinde
                </span>
            </button>

            <button
                class="health-btn"
                id="badBtn"
                onclick="setHealth('bad')"
            >
                <span class="health-label">
                    İyi değilim
                </span>

                <span class="health-sub">
                    biraz kötüyüm
                </span>
            </button>

        </div>

    </section>

    <!-- İLAÇLAR -->

    <div class="section-head">

        <div class="section-title">
            İlaçlar
        </div>

        <div
            class="section-date"
            id="sectionDate"
        ></div>

    </div>

    <section class="medicines">

        <!-- BETASERC -->

        <article class="medicine">

            <div class="med-icon bet-icon">
                💗
            </div>

            <div class="med-content">

                <div class="med-name">
                    Betaserc
                </div>

                <div
                    class="med-desc"
                    id="betasercDesc"
                >
                    İyiyken sabah kullan.
                </div>

                <div class="dose-list">

                    <div class="dose">

                        <div class="dose-info">
                            Sabah
                        </div>

                        <button
                            class="take"
                            id="betasercMorning"
                            onclick="
                            toggleDose(
                                'betasercMorning',
                                this
                            )
                            "
                        >
                            Aldım
                        </button>

                    </div>

                    <div
                        class="dose"
                        id="eveningDose"
                        style="display:none"
                    >

                        <div class="dose-info">
                            Akşam
                        </div>

                        <button
                            class="take"
                            id="betasercEvening"
                            onclick="
                            toggleDose(
                                'betasercEvening',
                                this
                            )
                            "
                        >
                            Aldım
                        </button>

                    </div>

                </div>

            </div>

            <!-- Sağdaki kolonun kartla
                 aynı genişlikte kalması için -->
            <div></div>

        </article>

        <!-- CITOLES -->

        <article class="medicine">

            <div class="med-icon cit-icon">
                🌿
            </div>

            <div class="med-content">

                <div class="med-name">
                    Citoles
                </div>

                <div class="med-desc">
                    Sabah içmeyi unutma.
                </div>

            </div>

            <button
                class="take"
                id="citoles"
                onclick="
                toggleMedicine(
                    'citoles',
                    this
                )
                "
            >
                Aldım
            </button>

        </article>

        <!-- B12 -->

        <article class="medicine">

            <div class="med-icon b12-icon">
                🧡
            </div>

            <div class="med-content">

                <div class="med-name">
                    B12
                </div>

                <div class="med-desc">
                    Tok karnına, günde 1 defa.
                </div>

            </div>

            <button
                class="take"
                id="b12"
                onclick="
                toggleMedicine(
                    'b12',
                    this
                )
                "
            >
                Aldım
            </button>

        </article>

    </section>

    <!-- DURUM -->

    <section class="progress-card">

        <div class="progress-head">

            <div class="progress-title">
                Bugünkü durum
            </div>

            <div
                class="progress-count"
                id="progressCount"
            >
                0 / 3
            </div>

        </div>

        <div
            class="hearts"
            id="hearts"
        ></div>

        <div
            class="complete"
            id="complete"
        >
            Bugünlük tamamdır.
        </div>

    </section>

    <div class="reset-area">

        <button
            class="reset-btn"
            onclick="resetToday()"
        >
            Bugünü sıfırla
        </button>

    </div>

</main>

<div
    class="toast"
    id="toast"
></div>

<script>

/* ==================================================
   TÜRKİYE TARİHİ
================================================== */

function turkeyDate() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Europe/Istanbul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(
        new Date()
    );
}


/* ==================================================
   VERİ
================================================== */

function key() {

    return "esek_" +
        turkeyDate();

}


function defaultData() {

    return {

        health: "good",

        doses: {

            betasercMorning: false,
            betasercEvening: false,
            citoles: false,
            b12: false

        }

    };

}


function loadData() {

    const saved =
        localStorage.getItem(
            key()
        );

    if (!saved) {

        return defaultData();

    }

    try {

        return JSON.parse(saved);

    } catch {

        return defaultData();

    }

}


let data = loadData();


function save() {

    localStorage.setItem(
        key(),
        JSON.stringify(data)
    );

}


/* ==================================================
   SAAT
================================================== */

function updateClock() {

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            "tr-TR",
            {
                timeZone:
                    "Europe/Istanbul",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",

                hour12: false
            }
        );

    const date =
        now.toLocaleDateString(
            "tr-TR",
            {
                timeZone:
                    "Europe/Istanbul",

                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    document
        .getElementById("clock")
        .textContent = time;

    document
        .getElementById("date")
        .textContent =
        date;

    document
        .getElementById("sectionDate")
        .textContent =
        date;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* ==================================================
   SAĞLIK
================================================== */

function setHealth(status) {

    data.health = status;

    save();

    render();

}


function updateHealth() {

    document
        .getElementById("goodBtn")
        .classList.toggle(
            "active",
            data.health === "good"
        );

    document
        .getElementById("badBtn")
        .classList.toggle(
            "active",
            data.health === "bad"
        );

}


/* ==================================================
   BETASERC
================================================== */

function updateBetaserc() {

    const evening =
        document.getElementById(
            "eveningDose"
        );

    const desc =
        document.getElementById(
            "betasercDesc"
        );

    if (
        data.health === "bad"
    ) {

        evening.style.display =
            "grid";

        desc.textContent =
            "İyi değilsen sabah ve akşam kullan.";

    } else {

        evening.style.display =
            "none";

        desc.textContent =
            "İyiyken sabah kullan.";

    }

    setButton(
        "betasercMorning",
        data.doses.betasercMorning
    );

    setButton(
        "betasercEvening",
        data.doses.betasercEvening
    );

}


/* ==================================================
   BUTONLAR
================================================== */

function setButton(
    id,
    done
) {

    const button =
        document.getElementById(id);

    if (!button) return;

    button.classList.toggle(
        "done",
        done
    );

    button.textContent =
        done
            ? "✓ Alındı"
            : "Aldım";

}


function toggleDose(
    name,
    button
) {

    const before =
        data.doses[name];

    data.doses[name] =
        !before;

    save();

    render();

    if (!before) {

        hearts(
            button
        );

    }

}


function toggleMedicine(
    name,
    button
) {

    const before =
        data.doses[name];

    data.doses[name] =
        !before;

    save();

    render();

    if (!before) {

        hearts(
            button
        );

    }

}


/* ==================================================
   DİĞER BUTONLAR
================================================== */

function updateOtherButtons() {

    setButton(
        "citoles",
        data.doses.citoles
    );

    setButton(
        "b12",
        data.doses.b12
    );

}


/* ==================================================
   İLERLEME
================================================== */

function updateProgress() {

    let total = 3;

    let done = 0;

    if (
        data.doses.betasercMorning
    ) {
        done++;
    }

    if (
        data.health === "bad"
    ) {

        total = 4;

        if (
            data.doses.betasercEvening
        ) {
            done++;
        }

    }

    if (
        data.doses.citoles
    ) {
        done++;
    }

    if (
        data.doses.b12
    ) {
        done++;
    }

    document
        .getElementById(
            "progressCount"
        )
        .textContent =
        done +
        " / " +
        total;

    const heartsBox =
        document.getElementById(
            "hearts"
        );

    heartsBox.innerHTML = "";

    for (
        let i = 0;
        i < total;
        i++
    ) {

        const span =
            document.createElement(
                "span"
            );

        span.className =
            "progress-heart";

        span.textContent =
            i < done
                ? "♥"
                : "♡";

        if (i < done) {

            span.classList.add(
                "active"
            );

        }

        heartsBox.appendChild(
            span
        );

    }

    document
        .getElementById(
            "complete"
        )
        .classList.toggle(
            "show",
            done === total
        );

}


/* ==================================================
   ALINDIĞINDA KALPLER
================================================== */

function hearts(button) {

    const rect =
        button.getBoundingClientRect();

    const symbols = [
        "♥",
        "♥",
        "✦",
        "♥",
        "✦"
    ];

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const el =
            document.createElement(
                "span"
            );

        el.className =
            "floating-heart";

        el.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        el.style.left =
            (
                rect.left +
                rect.width / 2
            ) + "px";

        el.style.top =
            (
                rect.top +
                rect.height / 2
            ) + "px";

        el.style.setProperty(
            "--moveX",
            (
                Math.random() * 90 -
                45
            ) + "px"
        );

        el.style.setProperty(
            "--rotate",
            (
                Math.random() * 60 -
                30
            ) + "deg"
        );

        el.style.animationDelay =
            (
                Math.random() * .12
            ) + "s";

        document.body.appendChild(
            el
        );

        setTimeout(
            () => el.remove(),
            1300
        );

    }

}


/* ==================================================
   SIFIRLA
================================================== */

function resetToday() {

    if (
        !confirm(
            "Bugünün kayıtları sıfırlansın mı?"
        )
    ) {

        return;

    }

    localStorage.removeItem(
        key()
    );

    data =
        defaultData();

    render();

    showToast(
        "Bugün sıfırlandı."
    );

}


/* ==================================================
   TOAST
================================================== */

let toastTimer;

function showToast(text) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1700
        );

}


/* ==================================================
   YENİ GÜN KONTROLÜ
================================================== */

let currentDay =
    turkeyDate();

setInterval(
    () => {

        const today =
            turkeyDate();

        if (
            today !== currentDay
        ) {

            currentDay =
                today;

            data =
                loadData();

            render();

        }

    },
    1000
);


/* ==================================================
   RENDER
================================================== */

function render() {

    updateHealth();

    updateBetaserc();

    updateOtherButtons();

    updateProgress();

}

render();

</script>
